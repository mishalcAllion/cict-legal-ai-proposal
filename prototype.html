<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CICT Assistant Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable concept prototype of a legal and compliance AI assistant, with sample data only.">
<style>
  :root {
    --page-bg: #f5f6f8;
    --page-fg: #1f2329;
    --banner-bg: #fff7e6;
    --banner-fg: #874d00;
    --mark-bg: #fff1b8;
    --mark-strong: #ffe58f;
    --ins-bg: #d9f7be;
    --ins-fg: #135200;
    --del-bg: #ffccc7;
    --del-fg: #820014;
    --paper-bg: #ffffff;
    --paper-border: #e5e7eb;
    --shell-top: 84px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #0f1115;
      --page-fg: #e6e8eb;
      --banner-bg: #2b2111;
      --banner-fg: #ffd591;
      --mark-bg: #594214;
      --mark-strong: #7c5914;
      --ins-bg: #1f3a12;
      --ins-fg: #b7eb8f;
      --del-bg: #4a1518;
      --del-fg: #ffa39e;
      --paper-bg: #1a1d23;
      --paper-border: #30343c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #0f1115;
    --page-fg: #e6e8eb;
    --banner-bg: #2b2111;
    --banner-fg: #ffd591;
    --mark-bg: #594214;
    --mark-strong: #7c5914;
    --ins-bg: #1f3a12;
    --ins-fg: #b7eb8f;
    --del-bg: #4a1518;
    --del-fg: #ffa39e;
    --paper-bg: #1a1d23;
    --paper-border: #30343c;
    color-scheme: dark;
  }
  html, body { margin: 0; padding: 0; background: var(--page-bg); color: var(--page-fg); }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans Sinhala", "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x: hidden; }
  #root { min-height: 100vh; }
  [hidden] { display: none !important; }

  /* Boot screen, replaced when React mounts */
  .boot { min-height: 100vh; display: grid; place-items: center; font-size: 14px; color: var(--page-fg); opacity: .7; padding: 16px; text-align: center; }

  /* Concept banner */
  .proto-banner { height: 28px; display: flex; align-items: center; justify-content: center; padding: 0 16px; font-size: 12px; background: var(--banner-bg); color: var(--banner-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proto-banner span { overflow: hidden; text-overflow: ellipsis; }

  /* Typing indicator */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; animation: typing-blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: .9; transform: translateY(-2px); } }
  .stream-caret::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: -2px; background: currentColor; opacity: .5; animation: caret 1s steps(2) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  /* Document viewer */
  .doc-page { background: var(--paper-bg); border: 1px solid var(--paper-border); border-radius: 6px; padding: 20px 22px 12px; margin: 0 0 14px; font-family: Georgia, "Times New Roman", "Noto Serif", serif; font-size: 14px; line-height: 1.65; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .doc-page .doc-page-no { font-family: inherit; text-align: center; font-size: 11px; opacity: .55; margin-top: 8px; }
  .doc-clause { padding: 6px 8px; margin: 0 -8px 6px; border-radius: 4px; scroll-margin: 24px; transition: background-color .4s; }
  .doc-clause h4 { margin: 0 0 2px; font-size: 13px; font-family: inherit; }
  .doc-clause p { margin: 0; }
  .doc-clause.is-hl { background: var(--mark-bg); box-shadow: inset 3px 0 0 #faad14; }
  .doc-gap { text-align: center; font-size: 12px; opacity: .55; margin: -4px 0 12px; font-family: inherit; }
  mark.ent { background: var(--mark-bg); color: inherit; border-radius: 3px; padding: 0 2px; }
  mark.ent-masked { background: var(--ins-bg); color: var(--ins-fg); border-radius: 3px; padding: 0 2px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }
  mark.ent-deleted { background: var(--del-bg); color: var(--del-fg); border-radius: 3px; padding: 0 2px; font-size: .92em; }

  /* Redline */
  .redline { line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .redline ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; border-radius: 2px; padding: 0 1px; }
  .redline del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; border-radius: 2px; padding: 0 1px; }

  /* Tables never push the page sideways */
  .ant-table-wrapper { max-width: 100%; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  .nowrap { white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }
  .clickable-row { cursor: pointer; }

  /* SOW text */
  .sow-body p, .sow-body li { line-height: 1.6; }
  .sow-body li.hl { background: var(--mark-bg); border-radius: 4px; padding: 2px 6px; margin-left: -6px; }
  .sow-body table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .sow-body th, .sow-body td { border: 1px solid var(--paper-border); padding: 6px 8px; text-align: left; vertical-align: top; }

  @media (max-width: 575px) {
    .proto-banner { font-size: 11px; }
    .doc-page { padding: 14px 14px 10px; }
  }
</style>

<div id="root"><div class="boot">Loading the Legal &amp; Compliance Assistant prototype...</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.19/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@6.6.8/dist/antd-with-locales.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@6.3.4/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@8.0.4/dist/diff.min.js"></script>

<script src="app/sow-data.js"></script>
<script src="app/data-core.js"></script>
<script src="app/core.js"></script>
<script src="app/screens/workspace.js"></script>
<script src="app/data/assistant.js"></script>
<script src="app/screens/assistant.js"></script>
<script src="app/data/approvals-reviews.js"></script>
<script src="app/screens/approvals-reviews.js"></script>
<script src="app/screens/masking.js"></script>
<script src="app/data/contracts.js"></script>
<script src="app/screens/contracts.js"></script>
<script src="app/data/records-knowledge.js"></script>
<script src="app/screens/records-knowledge.js"></script>
<script src="app/data/admin.js"></script>
<script src="app/screens/admin.js"></script>
<script src="app/data/legal-policy.js"></script>
<script src="app/screens/legal-policy.js"></script>
<script src="app/data/compliance-board.js"></script>
<script src="app/screens/compliance-board.js"></script>
<script>window.APP && window.APP.start();</script>

</body>
</html>
